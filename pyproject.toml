[project]
name = "invoiceiq"
version = "0.1.0"
description = "Invoice data extraction with LLMs: structured output, validation, human review, Excel export"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.143.2",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.66.0",
]

[tool.uv]
default-groups = ["dev", "ui"]  # locally: everything

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["C408"]  # dict(key=...) reads better for the label tables
